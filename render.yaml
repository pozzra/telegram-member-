services:
  - type: web
    name: telegram-adder-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_API_ID
        value: "2040"
      - key: TELEGRAM_API_HASH
        value: "b18441a1ff607e10a989891a5462e627"
      - key: DEFAULT_COUNTRY_CODE
        value: "855"

