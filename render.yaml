services:
  - type: web
    name: telegram-adder-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start_server.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_API_ID
        value: "2040"
      - key: TELEGRAM_API_HASH
        value: "b18441a1ff607e10a989891a5462e627"
      - key: DEFAULT_COUNTRY_CODE
        value: "855"
      - key: BOT_TOKEN
        value: "9039008476:AAFWUTnldWvfiC9CYYTquNEj5SV7GRtlGiI"
      - key: ADMIN_CHAT_ID
        value: "1208908312"
      - key: ADMIN_USERNAME
        value: "kun_amra"
      - key: RENDER_EXTERNAL_URL
        value: "https://telegram-adder-web.onrender.com"
      # This service IS the central license server: revocations are stored in
      # its own SQLite DB and served from /api/license/admin/revoked.
      # Leave empty so the backend never calls itself over HTTP.
      - key: LICENSE_API_BASE
        value: ""
      # Live site whose license status is treated as authoritative. Set to the
      # Vercel URL so Render rejects keys revoked in the bot even if the push
      # could not be delivered.
      - key: VERCEL_LICENSE_URL
        value: "https://telegram-member.vercel.app"

